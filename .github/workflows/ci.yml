name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Databento.CSharpApiClient.Caching.slnx

      - name: Build (Debug)
        run: dotnet build Databento.CSharpApiClient.Caching.slnx -c Debug --no-restore --nologo

      - name: Build (Release)
        run: dotnet build Databento.CSharpApiClient.Caching.slnx -c Release --no-restore --nologo

      - name: Unit tests
        run: |
          dotnet test tests/Databento.CSharpApiClient.Caching.UnitTests/Databento.CSharpApiClient.Caching.UnitTests.csproj \
            -c Debug --no-build --no-restore --nologo \
            --logger "console;verbosity=normal"
